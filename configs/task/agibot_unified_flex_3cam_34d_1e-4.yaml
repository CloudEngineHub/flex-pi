# @package _global_
#
# FlexPi (flex_joint) — AgiBot 500hr pretrain, 34D rot6d relative layout (all
# 14 joint DoF kept). One checkpoint serves all 8 inference regimes via
# per-call joint_video / joint_dino / joint_pointmap on infer_action. The
# action head is the 34D layout yam_unified_flex_3cam_34d_rel_1e-4 trains, so
# this checkpoint warm-inits that finetune unchanged.

defaults:
  - override /data: agibot34
  - override /model: flexpi
  - _self_

batch_size: 8
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    concat_multi_camera: ${model.composite_layout}

learning_rate: 1e-4
num_epochs: 3
max_steps: null
log_every: 10
save_every: 1000
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
